<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A conversational Gwalior food recommendation assistant." />
  <title>Gwalior Foodie | Find your perfect bite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app-shell">
    <header class="hero">
      <div class="brand"><span class="brand-mark">✦</span> Gwalior Foodie</div>
      <div class="hero-copy">
        <p class="eyebrow">YOUR LOCAL FOOD COMPANION</p>
        <h1>What are you<br /><em>craving?</em></h1>
        <p>Tell us how you feel, what you love, or your budget. We’ll find the Gwalior dishes that fit.</p>
      </div>
      <div class="hero-orb" aria-hidden="true">🍛</div>
    </header>

    <section class="chat-panel" aria-label="Food recommendation chat">
      <div id="conversation" class="conversation" aria-live="polite">
        <article class="message assistant-message welcome-message">
          <div class="avatar">✦</div>
          <div class="bubble"><strong>Hello! I’m your Gwalior food guide.</strong>
            Looking for a quick dinner,comforting vegetarian food, or something delicious near you?</div>
        </article>
      </div>
      <div class="suggestions" aria-label="Suggested prompts">
        <button type="button" class="category-chip" data-prompt="Show me Chinese food">🍜 Chinese</button>
        <button type="button" class="category-chip" data-prompt="I want dessert">🍮 Desserts</button>
        <button type="button" class="category-chip" data-prompt="Show me pizza">🍕 Pizza</button>
        <button type="button" class="category-chip" data-prompt="Show me biryani">🍚 Biryani</button>
        <button type="button" class="category-chip" data-prompt="I want street food">🌮 Street Food</button>
        <button type="button" class="category-chip" data-prompt="Vegetarian under ₹250">Vegetarian under ₹250</button>
        <button type="button" class="category-chip" data-prompt="Quick dinner">Quick dinner</button>


      </div>
      <form id="chat-form" class="composer">
        <label class="sr-only" for="message-input">Your food request</label>
        <input id="message-input" type="text" maxlength="1000" autocomplete="off"
          placeholder="Try “spicy vegetarian food under ₹250”" />
        <button id="send-button" type="submit" aria-label="Send message">➜</button>
      </form>
      <p id="connection-note" class="connection-note"></p>
    </section>
  </main>

  <template id="card-template">
    <article class="food-card">
      <div class="food-photo">
        <img alt="" loading="lazy" />
        <span class="image-fallback">🍽️</span>
        <span class="match"></span>
        <button class="fav-btn" type="button" aria-label="Save to favorites" title="Favorite this dish">
          <svg class="heart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
            </path>
          </svg>
        </button>
      </div>
      <div class="card-content">
        <h3></h3>
        <p class="restaurant"></p>
        <div class="quick-facts"><span class="rating"></span><strong class="price"></strong></div>
        <p class="location"></p>
        <div class="badges"></div>
        <p class="reason"></p>
        <div class="delivery"></div>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>

</html>
